version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: smart_campus_db
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_password
      POSTGRES_DB: smartcampus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_campus_backend
    environment:
      - DATABASE_URL=postgres://smartcampus:smartcampus_password@db:5432/smartcampus_db
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: smart_campus_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
