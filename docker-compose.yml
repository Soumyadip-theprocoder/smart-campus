version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: smart_campus_db
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_password
      POSTGRES_DB: smartcampus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
